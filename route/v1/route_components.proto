syntax = "proto3";

package route.v1;

import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/wrappers.proto";
import "type/matcher/v1/regex.proto";

option go_package = "github.com/dubml/xds-api/route/v1;routev1";

message VirtualHost {
  string name = 1;
  repeated string domains = 2;
  repeated Route routes = 3;
}

message Route {
  string name = 1;
  RouteMatch match = 2;
  oneof action {
    RouteAction route = 3;
    NonForwardingAction non_forwarding_action = 7;
  }
}

message NonForwardingAction {}

message WeightedCluster {
  message ClusterWeight {
    string name = 1;
    google.protobuf.UInt32Value weight = 2;
    string cluster_header = 12;
  }
  repeated ClusterWeight clusters = 1;
  google.protobuf.UInt32Value total_weight = 2;
}

message RouteMatch {
  oneof path_specifier {
    string prefix = 1;
    string path = 2;
    type.matcher.v1.RegexMatcher safe_regex = 10;
  }
  repeated HeaderMatcher headers = 6;
}

message HeaderMatcher {
  string name = 1;
  oneof header_match_specifier {
    string exact_match = 4;
    string prefix_match = 9;
    type.matcher.v1.RegexMatcher safe_regex_match = 11;
  }
}

message RouteAction {
  oneof cluster_specifier {
    string cluster = 1;
    WeightedCluster weighted_clusters = 3;
  }
  google.protobuf.Duration timeout = 4;
  RetryPolicy retry_policy = 9;
  FaultPolicy fault_policy = 10;
}

message RetryPolicy {
  message RetryBackOff {
    google.protobuf.Duration base_interval = 1;
    google.protobuf.Duration max_interval = 2;
  }

  string retry_on = 1;
  google.protobuf.UInt32Value num_retries = 2;
  google.protobuf.Duration per_try_timeout = 3;
  repeated uint32 retriable_status_codes = 7;
  RetryBackOff retry_back_off = 8;
}

message FaultPolicy {
  FaultDelay delay = 1;
  FaultAbort abort = 2;
}

message FaultDelay {
  google.protobuf.Duration fixed_delay = 1;
  google.protobuf.UInt32Value percentage = 2;
}

message FaultAbort {
  uint32 http_status = 1;
  google.protobuf.UInt32Value percentage = 2;
}
