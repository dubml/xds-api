[package]
name = "xds-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
h2.workspace = true
rpc = { package = "triple-rpc", git = "https://github.com/dubml/triple.git", rev = "183db60c81effaff3b6218697b871690b59b87e6" }
prost.workspace = true
prost-types = "0.14"
thiserror.workspace = true
tokio.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"
x509-parser = "0.18"

[build-dependencies]
prost-build = "=0.14.4"

[dev-dependencies]
transport = { package = "triple-transport", git = "https://github.com/dubml/triple.git", rev = "183db60c81effaff3b6218697b871690b59b87e6" }
rcgen = { version = "0.14", features = ["x509-parser"] }

[lints]
workspace = true

[workspace]
members = ["."]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
base64 = "0.22"
bytes = "1"
h2 = "0.4"
http = "1"
prost = "0.14"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["rt"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
